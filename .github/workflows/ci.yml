name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprojekt/doctor-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: miniprojekt/doctor-calendar/.nvmrc
          cache: npm
          cache-dependency-path: |
            miniprojekt/doctor-calendar/package-lock.json
            miniprojekt/doctor-calendar/server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
